<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue KENI 2026 - Page Flip</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- St Page Flip Library -->
    <script src="https://unpkg.com/page-flip@1.4.6/dist/page-flip.umd.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">KENI</h1>
            <p class="tagline">Catalogue Interactif - Feuilletez notre catalogue</p>
        </header>

        <section class="viewer-section">
            <div class="viewer-wrapper">
                <!-- Previous Button -->
                <button class="nav-btn" id="prevBtn" title="Page précédente">❮</button>

                <!-- Book Container -->
                <div class="book-container">
                    <div id="book" class="book">
                        <!-- Pages will be generated here -->
                    </div>
                </div>

                <!-- Next Button -->
                <button class="nav-btn" id="nextBtn" title="Page suivante">❯</button>
            </div>

            <!-- Controls -->
            <div class="controls">
                <div class="page-jump">
                    <label for="pageInput">Aller à la page:</label>
                    <input type="number" id="pageInput" min="1" placeholder="N°">
                    <button id="jumpBtn">Aller</button>
                </div>
                <div class="page-info">
                    <span>Page <strong id="currentPage">1</strong> sur <strong id="totalPages">10</strong></span>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p>&copy; 2026 Essai Catalogue KENI. Tous droits réservés.</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
